<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440" />
    <title>Подарочные сертификаты — Timepad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="stage" data-node-id="391:11292">
      <header class="utility" data-node-id="391:11345">
        <button class="utility__city" type="button">
          <img
            class="utility__city-icon"
            src="assets/icons/pin.svg"
            width="32"
            height="32"
            alt=""
          />
          <span class="utility__city-text style-desktop-button">Москва</span>
        </button>
        <div class="utility__links">
          <a class="utility__link" href="https://timepad.ru/organization/">
            <span class="utility__link-text style-desktop-button">Организаторам</span>
            <img
              class="utility__link-icon"
              src="assets/icons/arrow.svg"
              width="32"
              height="32"
              alt=""
            />
          </a>
          <a class="utility__link" href="https://timepad.ru/journal/">
            <span class="utility__link-text style-desktop-button">Журнал</span>
            <img
              class="utility__link-icon"
              src="assets/icons/arrow.svg"
              width="32"
              height="32"
              alt=""
            />
          </a>
        </div>
      </header>

      <nav class="nav" data-node-id="391:11367">
        <div class="nav__logo-wrap">
          <a class="nav__logo" href="https://timepad.ru/" aria-label="Timepad">
            <img src="assets/icons/logo.svg" width="105" height="33" alt="TIMEPAD" />
          </a>
        </div>
        <div class="nav__links-wrap">
          <div class="nav__links">
            <a class="nav__link" href="https://timepad.ru/">
              <span class="nav__link-text style-desktop-button">Главная</span>
            </a>
            <a class="nav__link" href="https://timepad.ru/subscriptions/">
              <span class="nav__link-text style-desktop-button">Подписки</span>
            </a>
            <a class="nav__link" href="https://timepad.ru/collections/">
              <span class="nav__link-text style-desktop-button">Подборки</span>
            </a>
            <a class="nav__link" href="https://timepad.ru/categories/">
              <span class="nav__link-text style-desktop-button">Категории</span>
            </a>
            <a class="nav__link" href="https://timepad.ru/">
              <span class="nav__link-text style-desktop-button">Поиск событий</span>
            </a>
          </div>
        </div>
        <button class="nav__search" type="button" aria-label="Поиск">
          <img
            class="nav__search-icon"
            src="assets/icons/search.svg"
            width="32"
            height="32"
            alt=""
          />
        </button>
        <div class="nav__actions-wrap">
          <div class="nav__actions">
            <a class="create-event" href="https://timepad.ru/event/create/">
              <span class="style-desktop-button">Создать событие</span>
            </a>
            <div class="avatar" aria-hidden="true">
              <span class="avatar__fill"></span>
              <span class="avatar__letter">Р</span>
            </div>
          </div>
        </div>
      </nav>

      <div class="hero" data-node-id="391:11405">
        <div class="hero__banner">
          <h1 class="hero__title">Подарочные сертификаты</h1>
        </div>
        <img
          class="hero__ticket"
          src="assets/icons/ticket.svg"
          width="60"
          height="55"
          alt=""
        />
      </div>

      <p class="hero__lead style-p3-regular">
        Получатели сами решат, на какие события потратить сертификат: у&nbsp;нас&nbsp;больше 10&nbsp;000 событий ежемесячно
      </p>

      <div class="carousel" data-node-id="391:11294">
        <div
          class="certs"
          data-certs
          tabindex="0"
          role="region"
          aria-roledescription="карусель"
          aria-label="Дизайн сертификата"
        >
          <div class="certs__track" data-track>
            <button class="cert" type="button" data-cert aria-label="Счастливых моментов">
              <img src="assets/cards/mauve.png" width="438" height="272" alt="" />
            </button>
            <button class="cert" type="button" data-cert aria-label="Поздравляем">
              <img src="assets/cards/blue.png" width="438" height="272" alt="" />
            </button>
            <button class="cert is-active" type="button" data-cert aria-label="С любовью" aria-current="true">
              <img src="assets/cards/pink.png" width="438" height="272" alt="" />
            </button>
            <button class="cert" type="button" data-cert aria-label="Это тебе">
              <img src="assets/cards/olive.png" width="438" height="272" alt="" />
            </button>
            <button class="cert cert--mint" type="button" data-cert aria-label="Мятный сертификат">
              <span class="cert__fill"></span>
              <img
                class="cert__logo"
                src="assets/cards/green-logo.svg"
                width="186"
                height="52"
                alt=""
              />
            </button>
          </div>
        </div>

        <div class="stub" data-node-id="391:11297">
          <span class="stub__notch stub__notch--left" aria-hidden="true"></span>
          <span class="stub__notch stub__notch--right" aria-hidden="true"></span>
          <div class="ticket__panel">
            <div class="chips" role="group" aria-label="Номинал">
              <button class="chip style-p4-regular" type="button" data-value="1000">1 000 ₽</button>
              <button class="chip style-p4-regular" type="button" data-value="2000">2 000 ₽</button>
              <button class="chip style-p4-regular" type="button" data-value="5000">5 000 ₽</button>
              <button class="chip style-p4-regular" type="button" data-value="10000">10 000 ₽</button>
              <button class="chip style-p4-regular is-selected" type="button" data-value="15000" aria-pressed="true">
                15 000 ₽
              </button>
              <button class="chip style-p4-regular" type="button" data-value="custom">Своя сумма</button>
            </div>
            <div class="qty">
              <button class="icon-btn" type="button" data-qty="-1" aria-label="Уменьшить количество">
                <img src="assets/icons/minus.svg" width="24" height="24" alt="" />
              </button>
              <div class="qty__value style-p3-regular" data-qty-value>5</div>
              <button class="icon-btn" type="button" data-qty="1" aria-label="Увеличить количество">
                <img src="assets/icons/plus.svg" width="24" height="24" alt="" />
              </button>
            </div>
            <button class="checkout" type="button">
              <span class="checkout__label style-p4-bold">Оформить</span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
